<!doctype html>
<html lang="en" class="dark" data-theme="forge">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>SortForge - Interactive Sorting Algorithm Visualizer</title>
    <meta name="application-name" content="SortForge" />
    <meta
      name="description"
      content="Interactive sorting algorithm visualizer with 20+ algorithms, sorting sounds, fast-forward, rewind, and 100k+ elements support. Visualize bubble sort, quicksort, merge sort, radix sort, and more."
    />
    <meta
      name="keywords"
      content="sorting algorithms, visualization, bubble sort, quicksort, merge sort, heap sort, radix sort, algorithm visualizer, computer science"
    />
    <link rel="canonical" href="https://sort-forge.kototok.dev/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sort-forge.kototok.dev/" />
    <meta
      property="og:title"
      content="SortForge - Interactive Sorting Algorithm Visualizer"
    />
    <meta
      property="og:description"
      content="Interactive sorting algorithm visualizer with 20+ algorithms, sorting sounds, fast-forward, rewind, and 100k+ elements support."
    />
    <meta
      property="og:image"
      content="https://sort-forge.kototok.dev/og-image.png"
    />
    <meta property="og:site_name" content="SortForge" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SortForge",
        "alternateName": ["Sort Forge", "sort-forge.kototok.dev"],
        "url": "https://sort-forge.kototok.dev/"
      }
    </script>

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://sort-forge.kototok.dev/" />
    <meta
      name="twitter:title"
      content="SortForge - Interactive Sorting Algorithm Visualizer"
    />
    <meta
      name="twitter:description"
      content="Interactive sorting algorithm visualizer with 20+ algorithms, sorting sounds, fast-forward, rewind, and 100k+ elements support."
    />
    <meta
      name="twitter:image"
      content="https://sort-forge.kototok.dev/og-image.png"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-48.png" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
